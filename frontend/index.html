<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sudoku Solver</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center pt-8 pb-8 font-sans">
    <div id="app" class="bg-white shadow-2xl rounded-xl w-full max-w-5xl flex flex-col md:flex-row overflow-hidden border border-gray-200">
        
        <!-- Left Panel: Controls -->
        <div class="w-full md:w-1/3 bg-gray-50 border-r border-gray-200 p-6 flex flex-col gap-6">
            <header>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">AI Sudoku</h1>
                <p class="text-sm text-slate-500 mt-1 uppercase tracking-widest font-semibold">Heuristic Solvers</p>
            </header>

            <!-- Difficulty Selector -->
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Difficulty</h3>
                <div class="flex rounded-md overflow-hidden border border-gray-300 shadow-sm" id="diff-tabs">
                    <button class="diff-btn flex-1 py-2 text-sm font-medium bg-white text-gray-600 hover:bg-gray-50 transition-colors" data-diff="easy">Easy</button>
                    <button class="diff-btn flex-1 py-2 text-sm font-medium bg-blue-600 text-white transition-colors" data-diff="medium">Med</button>
                    <button class="diff-btn flex-1 py-2 text-sm font-medium bg-white text-gray-600 hover:bg-gray-50 transition-colors" data-diff="hard">Hard</button>
                    <button class="diff-btn flex-1 py-2 text-sm font-medium bg-white text-gray-600 hover:bg-gray-50 transition-colors" data-diff="expert">Expert</button>
                </div>
            </div>

            <!-- Algorithm Selector -->
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">AI Algorithm</h3>
                <div class="flex flex-col gap-2" id="algo-tabs">
                    <button class="algo-btn px-4 py-3 rounded-md text-sm font-medium text-left border border-gray-300 bg-blue-50 border-blue-400 text-blue-800 shadow-sm transition-all" data-algo="backtracking">1. Backtracking DFS</button>
                    <button class="algo-btn px-4 py-3 rounded-md text-sm font-medium text-left border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition-all" data-algo="forward_checking">2. Forward Checking</button>
                    <button class="algo-btn px-4 py-3 rounded-md text-sm font-medium text-left border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition-all" data-algo="informed">3. Informed CSP (MAC-3 & MRV)</button>
                    <button class="algo-btn px-4 py-3 rounded-md text-sm font-medium text-left border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition-all" data-algo="local_search">4. Local Search (Sim Ann.)</button>
                </div>
            </div>

            <div class="flex-grow"></div>

            <!-- Action Buttons -->
            <div class="flex flex-col gap-3">
                <button id="btn-generate" class="w-full py-3 rounded-md font-semibold text-slate-700 bg-slate-200 hover:bg-slate-300 transition-colors">
                    Generate Puzzle
                </button>
                <button id="btn-solve" class="w-full py-3 rounded-md font-semibold text-white bg-blue-600 hover:bg-blue-700 shadow-md transition-colors">
                    Solve Instantly
                </button>
                <div class="flex gap-2 w-full">
                    <button id="btn-visualize" class="flex-1 py-3 rounded-md font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md transition-colors">
                        Visualise Steps
                    </button>
                    <button id="btn-stop" class="hidden w-[80px] py-3 rounded-md font-semibold text-white bg-red-600 hover:bg-red-700 shadow-md transition-colors">
                        Stop
                    </button>
                </div>
                <button id="btn-benchmark" class="w-full py-2 mt-2 rounded-md text-sm font-bold text-orange-600 border border-orange-200 bg-orange-50 hover:bg-orange-100 transition-colors">
                    Run Benchmark
                </button>
            </div>
        </div>

        <!-- Center/Right Panel -->
        <div class="w-full md:w-2/3 p-6 flex flex-col gap-6 bg-white overflow-y-auto">
            
            <!-- Context Header -->
            <div class="flex justify-between items-end border-b border-gray-200 pb-2">
                <div>
                    <h2 class="text-xl font-bold text-slate-800" id="board-title">Grid View</h2>
                    <p class="text-sm border text-blue-700 font-mono tracking-tight mt-1 bg-blue-50 px-2 py-0.5 rounded inline-block" id="status-badge">Idle</p>
                </div>
                <div id="prog-container" class="hidden text-right">
                    <span class="text-xs font-bold text-gray-500 uppercase">Live Stream</span>
                    <div class="w-32 h-2 mt-1 bg-gray-200 rounded-full overflow-hidden">
                        <div class="w-full h-full bg-indigo-500 animate-pulse"></div>
                    </div>
                </div>
            </div>

            <!-- Top Row: The Grid + Metrics -->
            <div class="flex flex-col lg:flex-row gap-8 items-start">
                
                <!-- The 9x9 Sudoku Board Grid -->
                <div id="sudoku-board" class="shrink-0 w-[360px] h-[360px] sm:w-[400px] sm:h-[400px] bg-white border-2 border-slate-800 grid grid-cols-9 grid-rows-9 focus:outline-none shadow-sm">
                    <!-- Grid generated by JS -->
                </div>

                <!-- Metrics Panel -->
                <div class="flex-grow w-full grid grid-cols-2 gap-4">
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-3">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-widest block mb-1">Time Elapsed</span>
                        <div class="text-xl font-semibold text-slate-800 font-mono" id="metric-time">0.0 ms</div>
                    </div>
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-3">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-widest block mb-1">States Explored</span>
                        <div class="text-xl font-semibold text-blue-700 font-mono" id="metric-states">0</div>
                    </div>
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-3">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-widest block mb-1">Assignments</span>
                        <div class="text-xl font-semibold text-slate-800 font-mono" id="metric-assigns">0</div>
                    </div>
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-3">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-widest block mb-1">Backtracks</span>
                        <div class="text-xl font-semibold text-red-600 font-mono" id="metric-backtracks">0</div>
                    </div>
                </div>
            </div>
            
            <!-- Comparison Dashboard Chart Area -->
            <div id="chart-container" class="mt-4 pt-4 border-t border-gray-200 hidden pb-4">
                <h3 class="text-sm font-bold text-gray-600 uppercase tracking-widest mb-4">Benchmark Dashboard</h3>
                <div class="w-full relative h-[250px]">
                    <canvas id="benchmarkChart"></canvas>
                </div>
            </div>

        </div>
    </div>

    <!-- Main Logic -->
    <script src="app.js"></script>
</body>
</html>
