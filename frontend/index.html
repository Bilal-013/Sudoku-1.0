<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sudoku Target GUI</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f0f2f5] min-h-screen flex justify-center items-center font-sans tracking-wide select-none">
    
    <!-- Mobile App Container -->
    <div id="app" class="bg-white w-full max-w-md h-full sm:h-auto sm:min-h-[850px] sm:shadow-2xl sm:border border-gray-100 flex flex-col pt-8 pb-4">
        
        <!-- Header Section -->
        <header class="flex justify-between items-center px-4 mb-3">
            <h1 class="text-[#2b3a56] text-3xl font-bold tracking-widest leading-none">0</h1>
            <button class="text-[#3b5998] opacity-80 pr-2 pb-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </header>

        <!-- Status / Toolbar Section -->
        <div class="px-3 flex justify-between items-end text-[11px] text-gray-500 font-semibold uppercase tracking-wider mb-2">
            <div class="flex flex-col mb-0.5">
                <span class="opacity-80">Difficulty</span>
                <span class="text-gray-700 capitalize tracking-normal text-sm font-medium pt-1">Expert</span>
            </div>
            <div class="flex flex-col mb-0.5">
                <span class="opacity-80">Mistakes</span>
                <span class="text-gray-700 font-medium tracking-normal text-sm pt-1">0/3</span>
            </div>
            <div class="flex flex-col relative right-1">
                <span class="opacity-80 pb-[1px]">Time</span>
                <div class="flex items-center gap-2 -mb-2">
                    <span class="text-gray-700 tracking-wider text-sm">00:00</span>
                    <button class="bg-[#eaedf4] text-[#334b7a] w-7 h-7 rounded-full flex justify-center items-center shadow-sm relative bottom-1 active:scale-95"><span>||</span></button>
                </div>
            </div>
        </div>

        <!-- The 9x9 Sudoku Board Grid -->
        <div id="sudoku-board" class="w-[96%] mx-auto aspect-square bg-white border-2 border-[#1c2738] grid grid-cols-9 grid-rows-9 focus:outline-none mb-6">
            <!-- Grid generated by JS based on 3x3 block styles -->
        </div>

        <div class="flex-grow"></div>
        
        <!-- Action Buttons Context Bar -->
        <div class="flex justify-evenly px-4 mb-10 text-[11px] tracking-wide text-[#7d8694] uppercase font-semibold">
            <!-- Undo action -->
            <button class="flex flex-col justify-center items-center gap-2 w-14 group transition-transform active:scale-90">
                <div class="rounded-full flex items-center justify-center text-[#40567f] group-active:text-gray-900 border border-transparent w-[38px] h-[38px]">
                    <svg class="w-6 h-6 transform -scale-x-100" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg>
                </div>
                <span>Undo</span>
            </button>
            
            <!-- Erase action -->
            <button class="flex flex-col justify-center items-center gap-2 w-14 group transition-transform active:scale-90">
                <div class="rounded-full flex items-center justify-center text-[#40567f] group-active:text-gray-900 border border-transparent w-[38px] h-[38px]">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21L21 7L17 3L3 17V21H7Z" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8L16 12" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 21H21" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <span>Erase</span>
            </button>
            
            <!-- Notes toggle -->
            <button class="flex flex-col justify-center items-center gap-2 w-14 relative group transition-transform active:scale-90">
                <span class="absolute -top-1 -right-0 text-[9px] bg-[#d3d9e8] text-gray-500 font-bold tracking-tight rounded-full px-2 py-[2px] z-10">OFF</span>
                <div class="rounded-full flex items-center justify-center text-[#40567f] group-active:text-gray-900 border border-transparent w-[38px] h-[38px]">
                    <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                </div>
                <span>Notes</span>
            </button>

            <!-- Hint button -->
            <button class="flex flex-col justify-center items-center gap-2 w-14 relative group transition-transform active:scale-90">
                <span class="absolute -top-2 -right-0 text-[10px] bg-[#3169d4] text-white font-bold rounded-full w-[18px] h-[18px] flex items-center justify-center z-10">1</span>
                <div class="rounded-full flex items-center justify-center text-[#40567f] group-active:text-gray-900 border border-transparent w-[38px] h-[38px]">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>
                </div>
                <span>Hint</span>
            </button>
        </div>

        <!-- Numeric Keypad input area -->
        <div id="numpad" class="flex justify-between w-full px-3 pb-8 text-[#264c9d] font-normal text-[40px] leading-none">
            <!-- Numpad injected by app.js -->
        </div>

    </div>

    <!-- Main Logic -->
    <script src="app.js"></script>
</body>
</html>
